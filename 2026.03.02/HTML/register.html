<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
  <h2>Registration (for users)</h2>
  <form id="registerForm">
    Username: <input type="text" id="username" required><br><br>
    Email: <input type="email" id="email" required><br><br>
    Password: <input type="password" id="password" required><br><br>
    Birthdate: <input type="date" id="birthdate" required><br><br>
    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="../HTML/login.html">Login here</a></p>

  <!-- Itt hívjuk a JS-t, modul módban -->
  <script type="module" src="../JS/register.js"></script>
</body>
</html>
